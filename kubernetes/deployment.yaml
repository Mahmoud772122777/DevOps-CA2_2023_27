apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-ca2
  labels:
    app: devops-ca2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-ca2
  template:
    metadata:
      labels:
        app: devops-ca2
    spec:
      containers:
        - name: devops-ca2
          image: docker.io/library/devops-ca2:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20